    <script>
      // GitHub Pages SPA 重定向恢复：深层路径 404 时 404.html 把路径存入 sessionStorage 并跳回根，
      // 这里在应用挂载前把地址栏还原，交给 Web History 路由匹配。
      ;(function () {
        var redirect = sessionStorage.getItem('gh-pages-redirect')
        if (redirect) {
          sessionStorage.removeItem('gh-pages-redirect')
          history.replaceState(null, '', redirect)
        }
      })()
    </script>
